name: ci

on:
  push:
    branches:
      - main
      - feat/*
      - fix/*
      - chore/*
      - refactor/*
      - test/*
      - ci/*
      - build/*
      - perf/*
      - docs/*
  pull_request:
    branches:
      - main

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    env:
      COREPACK_DEFAULT_TO_LATEST: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable corepack
        run: corepack enable
      - name: Install AntelopeJS CLI
        run: |
          pnpm add --global @antelopejs/core
          echo "$(pnpm bin --global)" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run prepack
      - run: pnpm run lint
      - run: pnpm run test
